<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デザインする｜ITTENMON</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Jost:wght@400;500;600&family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+Rounded+1c:wght@800&family=Noto+Serif+JP:wght@700&family=Shippori+Mincho:wght@600&family=Klee+One:wght@600&family=Yomogi&family=Kaisei+Decol:wght@700&family=Dancing+Script:wght@600&family=Great+Vibes&family=Pacifico&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shop.css?v=1121k">
<style>
/* 編集画面：左に道具の切り替え、その隣に道具パネル、中央にケース */
html,body{height:100%}
body{display:flex;flex-direction:column;background:#f1f0ed}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.ed-top .logo{font-size:16px}
.ed-top .model{font-size:13px;color:var(--sub)}
.ed-top .go{background:linear-gradient(180deg,#2d8cff,#0f62e6);color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.06em;box-shadow:0 4px 14px rgba(15,98,230,.4)}
.ed-top .go:hover{background:var(--accent)}
.ed{flex:1;display:grid;grid-template-columns:72px 280px 1fr;min-height:0}
.rail{background:#2b2b2b;display:flex;flex-direction:column;padding-top:8px}
.rail button{background:none;border:0;color:#bbb;padding:12px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.rail button svg{width:24px;height:24px}
.rail button[aria-pressed="true"]{color:#fff;background:#3d3d3d}
.panel{background:#fff;border-right:1px solid var(--line);padding:18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:15px}
.cut-hero{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px solid #1f8fff;border-radius:12px;background:#f2f8ff}
.cut-main{min-height:52px;border:0;border-radius:10px;background:#1f8fff;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.cut-main.on{background:#fff;color:#1f8fff;border:2px solid #1f8fff}
.cut-main:disabled{opacity:.6}
.cutq{background:#1f8fff;color:#fff;border-color:#1f8fff}
.cutq.on{background:#fff;color:#1f8fff}
.cutq[hidden]{display:none}
.ai-box{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px solid #8a5cc2;border-radius:12px;background:#f7f2fd;font-size:13px;line-height:1.6}
.ai-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.ai-chips button{padding:9px 14px;border-radius:999px;border:1px solid #8a5cc2;background:#f7f2fd;color:#5a2d99;font-size:14px;font-weight:700}
.fix-modes{display:flex;gap:8px}
.fix-modes button{flex:1;min-height:64px;border:2px solid #ccc;border-radius:12px;background:#fff;font-size:17px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.fix-modes button small{font-size:11px;font-weight:400;color:#666}
.fix-modes button[aria-pressed="true"]{border-color:#8a5cc2;background:#f3ecfb;color:#5a2d99}
.panel[data-tool="fix"]{height:auto!important;max-height:42dvh}
.ai-box b{font-size:14px;color:#5a2d99}
.ai-btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:10px;background:#8a5cc2;color:#fff;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.panel h3.sub{font-size:13px;color:var(--sub);margin:6px 0 -4px;font-weight:700}
.panel .help{font-size:12px;color:var(--sub)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;padding:22px 10px;cursor:pointer;font-size:14px;border-radius:6px;position:relative}
.tile:hover{border-color:var(--text)}
.tile svg{width:34px;height:34px;color:var(--accent)}
.tile input{position:absolute;inset:0;opacity:0;cursor:pointer}
label.tile{flex-direction:row;gap:12px;min-height:68px;padding:16px 18px;border:0;border-radius:14px;background:linear-gradient(180deg,#2d8cff,#0f62e6);color:#fff;font-size:18px;font-weight:800;letter-spacing:.04em;box-shadow:0 6px 16px rgba(15,98,230,.4)}
label.tile svg{width:30px;height:30px;color:#fff}
label.tile::after{content:"＋";font-size:26px;font-weight:700;line-height:1;margin-left:2px}
label.tile:active{transform:scale(.98)}
.row{display:flex;flex-direction:column;gap:6px}
.row label{font-size:12px;color:var(--sub)}
.row input[type=range]{width:100%}
.row input[type=text],.row select{border:1px solid #d6d3cc;padding:9px;font-size:14px;width:100%;background:#fff}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{border:1px solid #d6d3cc;background:#fff;padding:8px 10px;font-size:12px;cursor:pointer}
.btns button:hover{border-color:var(--text)}
.btns .danger{color:var(--danger)}
.swatch{display:flex;flex-wrap:wrap;gap:6px}
.swatch button{width:28px;height:28px;border-radius:50%;border:1px solid #bbb;cursor:pointer}
.swatch button[aria-pressed="true"]{outline:2px solid var(--text);outline-offset:2px}
.swatch.bg100{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.swatch.bg100 button{width:100%;height:auto;aspect-ratio:1}
#bgFree,.free{width:100%;height:40px;border:1px solid #d6d3cc;padding:2px;cursor:pointer}
.layers{display:flex;flex-direction:column;gap:6px}
.layers button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;padding:9px 10px;font-size:13px;cursor:pointer;text-align:left}
.layers button[aria-pressed="true"]{border-color:var(--text);background:#f7f6f3}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;min-width:0;position:relative}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-self:stretch}
.tools button{border:1px solid var(--line);background:#fff;padding:6px 10px;font-size:12px;cursor:pointer}
.tools button:disabled{opacity:.4;cursor:default}
.tools #saveMy{border-color:#d9a0b4;color:#b0466a}
canvas#cv{touch-action:none;max-width:100%;max-height:calc(100vh - 200px);cursor:grab;filter:drop-shadow(0 10px 24px rgba(0,0,0,.15))}
.note{font-size:11px;color:var(--sub);text-align:center}
.state{font-size:12px}
/* 確認画面 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal .box{background:#fff;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:24px;display:grid;gap:24px}
@media(min-width:700px){.modal .box{grid-template-columns:240px 1fr}}
.modal img{width:100%;border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.modal h2{font-size:18px;margin-bottom:8px}
.modal dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:10px 0}
.modal dt{color:var(--sub)}
.modal .act{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

.tpl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.tpl button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;cursor:pointer}
.tpl button[aria-pressed="true"]{border-color:var(--text);background:#f7f6f3}
.tpl img{width:100%;max-width:96px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tpl.bgs{grid-template-columns:repeat(3,1fr)}
.tpl.flt img{width:100%;aspect-ratio:1;object-fit:cover}
.sheet-head{display:none}
/* スマホ：道具を下に */
@media(max-width:820px){
  /* スマホ：画面いっぱいのアプリ表示。上＝ケース、下＝道具の引き出し、いちばん下＝道具の切り替え＋「確認へ」（親指の位置） */
  html,body{height:100%;overflow:hidden}
  body{height:100dvh}
  .ed-top{padding:6px 14px;min-height:40px;gap:8px;border-bottom:1px solid var(--line)}
  .ed-top .logo{display:none}
  .ed-top .model{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ed-top .go{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 6px);z-index:40;height:52px;min-width:124px;padding:0 16px;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:.02em;background:linear-gradient(180deg,#2d8cff,#0f62e6);box-shadow:0 4px 14px rgba(15,98,230,.5)}
  .ed{flex:1;min-height:0;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto auto}
  .stage{order:1;padding:6px 10px;gap:6px;min-height:0;overflow:hidden;justify-content:flex-start}
  .tools{flex-wrap:nowrap;gap:6px;justify-content:center}
  .tools button{flex:0 0 auto;padding:8px 12px;font-size:12.5px;min-height:36px;border-radius:8px}
  .note{display:none}
  canvas#cv{max-width:100%;margin:auto;max-height:50dvh}
  .panel{order:2;border-right:0;border-top:1px solid var(--line);height:34dvh;max-height:none;padding:12px 14px;gap:12px;-webkit-overflow-scrolling:touch}
  .panel[data-tool="tmpl"],.panel[data-tool="bg"]{height:54dvh;max-height:none;border-radius:18px 18px 0 0;box-shadow:0 -10px 28px rgba(0,0,0,.2);padding-top:0}
  .sheet-head{display:flex;position:sticky;top:0;z-index:3;background:#fff;align-items:center;justify-content:space-between;padding:12px 0 10px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line)}
  .sheet-head h2{font-size:16px}
  .sheet-head button{min-height:40px;padding:0 16px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer}
  .d-only{display:none}
  /* 道具はすべて、下から出る選択画面（閉じているときはケースを広く） */
  .panel{height:52dvh;max-height:none;border-radius:18px 18px 0 0;box-shadow:0 -10px 28px rgba(0,0,0,.2);padding-top:0}
  .panel[data-tool=""]{display:none}
  .tools .lbl{display:none}
  .tools button{min-width:44px;padding:8px 14px}
  .tools #saveMy{padding:8px 14px}
  .cutq{background:#1f8fff!important;color:#fff!important;border-color:#1f8fff!important;font-weight:700;padding:8px 14px!important;flex:1 1 auto}
  .cutq.on{background:#fff!important;color:#1f8fff!important}
  .toast{top:calc(46px + env(safe-area-inset-top,0px))!important;bottom:auto!important;max-width:86vw}
  .rail{order:3;flex-direction:row;justify-content:flex-start;padding:0 calc(140px + max(10px,env(safe-area-inset-right,0px))) env(safe-area-inset-bottom,0px) 0;background:#2b2b2b;min-height:calc(56px + env(safe-area-inset-bottom,0px))}
  .rail button{flex:1;padding:7px 0;font-size:10px;letter-spacing:-.04em;white-space:nowrap;min-height:56px;gap:2px}
  .rail button svg{width:22px;height:22px}
  /* テンプレート・背景は横にスワイプして選ぶ（キャンバスを広く使うため） */
  .panel[data-tool="tmpl"] .help,.panel[data-tool="bg"] .help{display:none}
  .panel[data-tool="tmpl"] .tpl,.panel[data-tool="bg"] .tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:visible;margin-top:4px;padding-bottom:16px}
  .tpl button{min-height:44px;padding:6px 4px}
  .tpl img{max-width:100%}
  .tpl.flt{grid-template-columns:repeat(3,1fr)}
  /* 押しやすい大きさ */
  .btns button,.layers button,.row select,.row input[type=text]{min-height:44px;font-size:14px}
  .row input[type=range]{height:34px}
  .swatch button{width:34px;height:34px}
  .swatch.bg100{grid-template-columns:repeat(7,1fr)}
  .tile{padding:18px 10px;min-height:72px}
  /* 確認画面：下にボタンを固定 */
  .modal{padding:0;align-items:flex-end}
  .modal .box{max-height:92dvh;border-radius:16px 16px 0 0;padding:16px 16px 0;gap:14px}
  .modal .act{position:sticky;bottom:0;background:#fff;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:8px;flex-direction:column}
  .modal .act .btn{width:100%;min-height:50px;font-size:15px}
  .modal img{max-height:34dvh;width:auto;margin:0 auto;display:block}
}
</style>

<body>
<div class="ed-top">
  <a href="product.html" class="logo">ITTENMON</a>
  <span class="model" id="modelLabel"></span>
  <button class="go" id="confirmBtn" type="button">デザインの確認</button>
</div>
<div id="cafeBar"></div>
<div class="ed">
  <nav class="rail" aria-label="道具">
    <button type="button" data-tool="tmpl" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>テンプレ</button>
    <button type="button" data-tool="photo" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>写真</button>
    <button type="button" data-tool="filter" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>フィルター</button>
    
    <button type="button" data-tool="text" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 6h14M12 6v13M9 19h6"/></svg>テキスト</button>
    <button type="button" data-tool="bg" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 7-7 7-7-7z"/><path d="M19 15c0 1.5 1 2.5 1 3.5a1 1 0 0 1-2 0c0-1 1-2 1-3.5z"/></svg>背景</button>
  </nav>
  <aside class="panel" id="panel"></aside>
  <main class="stage">
    <div class="tools">
      <button type="button" id="undo" disabled>↶<span class="lbl"> 元に戻す</span></button>
      <button type="button" id="redo" disabled>↷<span class="lbl"> やり直し</span></button>
      <button type="button" id="cutQuick" class="cutq" hidden>✂ 背景を消す</button>
      <button type="button" id="saveMy">♡<span class="lbl"> マイデザインに保存</span></button>
    </div>
    <canvas id="cv" width="546" height="1056" aria-label="デザイン"></canvas>
    <p class="note" id="shapeNote"></p>
  </main>
</div>
<div id="modalHost"></div>

<script src="js/config.js?v=1121j"></script>
<script src="js/models.js?v=1017a"></script>
<script src="js/common.js?v=1121g"></script>
<script>
(() => {
const {myDesigns, S, yen, esc, getCart, setCart, api, loadImage, toJpeg, toast, isCafe, qs, product, shapeOf, shapePath} = window.LICO;
const P = S.DESIGN;

/* ===== 商品・印刷サイズと表示 =====
   印刷用の大きさ（px）と形は商品ごと・スマホは機種ごとに変わる（common.js の shapeOf） */
const productId = qs.get("product") || (qs.get("model") ? "phone" : "");
const PR = product(productId);
const opt = qs.get("opt") || qs.get("model") || "", qty = Math.max(1, Math.min(20, parseInt(qs.get("qty")) || 1));
if(!productId || (PR.kind !== "none" && !opt)){ location.replace("product.html" + (productId ? "?id=" + productId : "")); return; }
const ccId = qs.get("cc") || "", CC = (PR.caseColors || []).find(c => c.id === ccId) || null;   // スマホケースの色
const SH = shapeOf(PR.id, opt, ccId);
const PW = SH.w, PH = SH.h, VIEW = Math.min(546 / PW, 1056 / PH, .8), U = Math.min(PW, PH) / 1092;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
cv.width = Math.round(PW * VIEW); cv.height = Math.round(PH * VIEW);
const variant = PR.kind === "variant" ? (PR.variants.find(v => v.id === opt) || PR.variants[0]) : null;
const optLabel = variant ? variant.label : opt;
const unit = variant ? variant.price : PR.price;
document.getElementById("modelLabel").textContent = `${PR.short}${optLabel ? "｜" + optLabel : ""}${CC ? "｜ケース：" + CC.label : ""}｜${qty}個`;
document.getElementById("shapeNote").textContent = PR.kind === "phone" ? "ピンクの線の内側がケースになります。カメラの穴の部分は印刷されません（形は目安です）。"
  : SH.kind === "board" ? "ピンクの線の内側が木のボードです。上の丸い穴の部分は印刷されません。" : "ピンクの線の内側が印刷される面です。";
if(isCafe()) document.getElementById("cafeBar").innerHTML = `<div class="mode-bar">${esc(window.LICO.cafeName())}でのご注文</div>`;

/* ===== デザインの状態 ===== */
let st = { bg: SH.base ? null : "#ffffff", photos: [], texts: [] };   // bg が null＝素材の色のまま（印刷しない）。photos：重ねる写真（あとのものほど上）{id, x, y, scale, rot, w, h}
let sel = "photo", selP = null;                        // 選んでいるもの："photo"（selP の写真）または テキストの番号
const MAX_PHOTOS = 3, MAX_STK = 30;
// このデザイン1回分の番号。写真は受付前の中の、この番号のフォルダにまとめて入る
const DSID = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const NUM = i => "①②③④⑤⑥⑦⑧⑨⑩"[i] || String(i + 1);   // 写真の番号（保存するファイル名と同じ）
const media = {};                                      // 写真ごとの画像と送信状態 {img, orig, cut, cutImg, fileId, uploading, err}
let cutting = false;
const cur = () => st.photos.find(p => p.id === selP) || null;   // 選んでいる写真
const curM = () => media[selP] || {};
const hist = [], future = [];
const snap = () => JSON.stringify({ bg: st.bg, photos: st.photos, texts: st.texts, selP });
function push(){ hist.push(snap()); if(hist.length > 60) hist.shift(); future.length = 0; syncUndo(); }
function restore(json){
  const s = JSON.parse(json); st.bg = s.bg; st.texts = s.texts; st.photos = (s.photos || []).filter(p => media[p.id]);
  selP = cur() ? selP : (st.photos.find(p => p.id === s.selP) || st.photos[st.photos.length - 1] || {}).id || null;
  if(sel === "photo" && !cur()) sel = null;
  if(typeof sel === "number" && !st.texts[sel]) sel = cur() ? "photo" : null;
  draw(); renderPanel(); syncUndo();
}
function syncUndo(){ document.getElementById("undo").disabled = !hist.length; document.getElementById("redo").disabled = !future.length; }
document.getElementById("undo").onclick = () => { if(!hist.length) return; future.push(snap()); restore(hist.pop()); };
document.getElementById("redo").onclick = () => { if(!future.length) return; hist.push(snap()); restore(future.pop()); };

/* ===== 写真の形（中心0,0・幅W・高さHの中に描く） ===== */
const FRAMES = [
  { id: "rect", label: "四角" }, { id: "round", label: "角丸" }, { id: "circle", label: "まる" }, { id: "oval", label: "だ円" },
  { id: "heart", label: "ハート" }, { id: "star", label: "星" }, { id: "flower", label: "お花" }, { id: "cloud", label: "くも" },
  { id: "cat", label: "ねこ" }, { id: "bear", label: "くま" }, { id: "rabbit", label: "うさぎ" }
];
// 写真の色味（プリクラ風フィルター）
const FILTERS = {
  none: { label: "そのまま" },
  mono: { label: "モノクロ" },
  monoH: { label: "くっきり白黒" },
  monoS: { label: "やわらか白黒" },
  sepia: { label: "セピア" },
  soft: { label: "ふんわり" },
  bright: { label: "美白" },
  vivid: { label: "あざやか" },
  pastel: { label: "パステル" },
  pink: { label: "ゆめかわ" }
};

    const cur = String(st.bg || "").indexOf("bg:") === 0 ? st.bg.slice(3) : "";
    const isHex = typeof st.bg === "string" && st.bg.charAt(0) === "#";
    const keep = fn => { const t = panel.scrollTop; fn(); panel.scrollTop = t; };
    panel.innerHTML = `<div class="sheet-head"><h2>背景を選ぶ</h2><button type="button" id="sheetClose">閉じる</button></div><h2 class="d-only">背景</h2><p class="help">写真が全体をおおっていないときに見える背景です。柄（${BGD.length}種類）と、無地の色（${TC.length}色＋自由な色）からえらべます。</p>
      <div class="ai-box"><b>AIで作った柄・お手持ちの画像も、背景に使えます</b><span>画像を選ぶと、ケース全体に広がります（あとから位置や大きさを変えられます）。</span>
        
        <label class="ai-btn"><input type="file" id="bgFileUp" accept="image/*" hidden>＋ 自分の柄・画像を背景にする</label></div>
      ${SH.base ? `<div class="btns"><button type="button" id="bgNone" ${st.bg ? "" : 'style="border-color:var(--text);background:#f7f6f3"'}>${esc(SH.baseLabel)}</button></div>` : ""}
      <h3 class="sub">柄・イラスト</h3>
      <div class="tpl bgs">${BGD.map(b => `<button type="button" data-b="${b.id}" aria-pressed="${b.id === cur}"><img src="${bgThumb(b.id)}" alt=""><span>${esc(b.label)}</span></button>`).join("")}</div>
      <h3 class="sub">無地の色</h3>
      <div class="swatch bg100" id="bgs">${TC.map(c => `<button type="button" data-c="${c}" aria-pressed="${c === st.bg}" style="background:${c}" aria-label="${c}"></button>`).join("")}</div>
      <div class="row"><label for="bgFree">ほかの色を自由に選ぶ</label><input type="color" id="bgFree" value="${isHex ? st.bg : "#ffffff"}"></div>`;
    const upl = panel.querySelector("#bgFileUp"); if(upl) upl.onchange = e => { const f = e.target.files[0]; e.target.value = ""; if(f) addAsBackground(f); };
    const bn = panel.querySelector("#bgNone"); if(bn) bn.onclick = () => { push(); st.bg = null; draw(); keep(renderPanel); };
    panel.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { push(); st.bg = "bg:" + b.dataset.b; draw(); keep(renderPanel); });
    panel.querySelectorAll("#bgs button").forEach(b => b.onclick = () => { push(); st.bg = b.dataset.c; draw(); keep(renderPanel); });
    panel.querySelector("#bgFree").onchange = e => { push(); st.bg = e.target.value; draw(); keep(renderPanel); };
  } else {
    panel.innerHTML = `<h2>レイヤー</h2><p class="help">選んだものを動かしたり、文字を直したりできます。</p>
      <div class="layers">${st.texts.map((t, i) => `<button type="button" data-l="${i}" aria-pressed="${sel === i}">${t.stk ? "スタンプ：" + ((STICKERS.find(x => x.id === t.stk) || {}).emoji || "♡") : "文字：" + (esc(t.text) || "（空）")}<span>›</span></button>`).reverse().join("")}
      ${st.photos.map((x, i) => `<button type="button" data-l="p:${x.id}" aria-pressed="${sel === "photo" && selP === x.id}">写真${NUM(i)}<span>›</span></button>`).reverse().join("")}</div>`;
    panel.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
      const v = b.dataset.l, isP = v.startsWith("p:"); if(isP) selP = v.slice(2); sel = isP ? "photo" : +v; tool = isP ? "photo" : (st.texts[+v].stk ? "deco" : "text");
      document.querySelectorAll(".rail button").forEach(x => x.setAttribute("aria-pressed", x.dataset.tool === tool)); draw(); renderPanel();
    });
  }
}
function syncSliders(){ const sc = document.getElementById("sc"), rt = document.getElementById("rt"); if(sc && cur()){ sc.value = Math.round(cur().scale * 100); rt.value = Math.round(cur().rot); } }

/* ===== デザインの確認 → カートへ ===== */
document.getElementById("confirmBtn").onclick = () => {
  if(!st.photos.length){ toast("写真を入れてください"); tool = "photo"; renderPanel(); return; }
  if(anyUploading()){ toast("写真を送信中です。少しお待ちください"); return; }
  const bad = st.photos.findIndex(p => !media[p.id].fileId);
  if(bad >= 0){ toast("写真" + NUM(bad) + "の送信に失敗しています。その写真を消して、選び直してください"); selP = st.photos[bad].id; sel = "photo"; tool = "photo"; renderPanel(); draw(); return; }
  const fileIds = st.photos.map(p => media[p.id].fileId), cut = st.photos.some(p => media[p.id].cut);
  const out = document.createElement("canvas"); out.width = PW; out.height = PH;
  const oc = out.getContext("2d"); paint(oc, 1, true);
  const png = !st.bg;   // 素材の色を残すときは、何も印刷しない部分を透明にする
  const full = out.toDataURL(png ? "image/png" : "image/jpeg", .95);
  const prev = document.createElement("canvas"); prev.width = Math.round(PW * .25); prev.height = Math.round(PH * .25);
  noFrame = true; const pc = prev.getContext("2d"); noFrame = true; paint(pc, .25, false);
  const thumb = prev.toDataURL("image/jpeg", .85);
  // お客様が画面で見ている完成イメージ（ケースの形・カメラの穴・素材の色ごと）。LICOが配置を確認するために保存する
  const look = document.createElement("canvas"); look.width = Math.round(PW * .6); look.height = Math.round(PH * .6);
  const lc = look.getContext("2d"); lc.fillStyle = "#ffffff"; lc.fillRect(0, 0, look.width, look.height); paint(lc, .6, false); noFrame = false;
  const lookData = look.toDataURL("image/jpeg", .9);
  const host = document.getElementById("modalHost");
  host.innerHTML = `<div class="modal" id="md"><div class="box">
    <img src="${thumb}" alt="できあがりイメージ">
    <div><h2>デザインの確認</h2>
      <dl><dt>商品</dt><dd>${esc(PR.name)}</dd>${PR.optionLabel ? `<dt>${esc(PR.optionLabel)}</dt><dd>${esc(optLabel)}</dd>` : ""}${CC ? `<dt>ケースの色</dt><dd>${esc(CC.label)}</dd>` : ""}<dt>数量</dt><dd>${qty}個</dd>
      <dt>文字</dt><dd>${st.texts.some(t => !t.stk) ? st.texts.filter(t => !t.stk).map(t => esc(t.text)).join("／") : "なし"}</dd><dt>スタンプ</dt><dd>${st.texts.filter(t => t.stk).length}個</dd><dt>写真</dt><dd>${st.photos.length}枚（${st.photos.map((_, i) => NUM(i)).join("")}）</dd><dt>背景透過</dt><dd>${cut ? "あり" : "なし"}</dd>
      <dt>金額</dt><dd><b>${yen(unit * qty)}</b>（税込）</dd></dl>
      <p class="help">画面の色と実際の仕上がりは少し異なることがあります。${PR.kind === "phone" ? "カメラの穴の部分は印刷されません。" : esc(PR.note || "")}</p>
      <p class="warnline">ご注文後は、内容（写真・文字・機種・色・数量）を変更できません。</p>
      <div class="act"><button class="btn" type="button" id="toCart">この内容でカートに入れる</button><button class="btn btn-line" type="button" id="back">デザインを直す</button></div>
      <p class="state" id="mdState"></p></div></div></div>`;
  host.querySelector("#back").onclick = () => host.innerHTML = "";
  host.querySelector("#toCart").onclick = async e => {
    e.target.disabled = true; document.getElementById("mdState").textContent = "できあがり画像を送っています…";
    try{
      const [r, rl] = await Promise.all([
        api({ action: "uploadPhoto", sid: DSID, name: png ? "design.png" : "design.jpg", mime: png ? "image/png" : "image/jpeg", data: full.split(",")[1] }),
        api({ action: "uploadPhoto", sid: DSID, name: "preview.jpg", data: lookData.split(",")[1] })
      ]);
      const cart = getCart();
      cart.push({ key: Date.now().toString(36), productId: PR.id, option: optLabel, caseColor: CC ? CC.label : "", variant: variant ? variant.id : "", model: optLabel || PR.short, qty, fileId: fileIds[0], fileIds, designFileId: r.fileId, previewFileId: rl.fileId, thumb,
        cut, text: st.texts.filter(t => !t.stk).map(t => t.text).join("／"), font: st.texts.filter(t => !t.stk).map(t => (P.fonts.find(f => f.id === t.font) || {}).label).join("／"),
        color: st.texts.filter(t => !t.stk).map(t => colorName(t.color)).join("／") });
      setCart(cart);
      await saveMy().catch(() => {});   // カートに入れたデザインは、マイデザインにも残す（あとで同じデザインを注文し直せる）
      location.href = "cart.html?added=1";
    }catch(err){ document.getElementById("mdState").textContent = err.message; e.target.disabled = false; }
  };
};

/* ===== マイデザイン（この端末に保存して、あとで開き直す） =====
   写真は元の画像と、背景を消した画像をそのまま保存する。開き直したときは写真を送り直す（前の注文の写真と混ざらないように） */
let myId = qs.get("my") || "";
async function saveMy(){
  if(!st.photos.length && !st.texts.length){ toast("写真か文字を入れてから保存してください"); return; }
  if(cutting){ toast("背景を消し終わってから保存してください"); return; }
  const btn = document.getElementById("saveMy"); btn.disabled = true;
  try{
    const prev = document.createElement("canvas"); prev.width = Math.round(PW * .25); prev.height = Math.round(PH * .25);
    const pc = prev.getContext("2d"); pc.fillStyle = "#ffffff"; pc.fillRect(0, 0, prev.width, prev.height); noFrame = true; paint(pc, .25, false); noFrame = false;
    const media2 = {};
    for(const p of st.photos){
      const m = media[p.id];
      media2[p.id] = { orig: m.orig.src, cut: !!m.cut, cutBlob: m.cutImg ? await fetch(m.cutImg.src).then(r => r.blob()) : null };
    }
    const now = Date.now();
    if(!myId) myId = "d" + now.toString(36);
    await myDesigns.put({ id: myId, saved: now, productId: PR.id, opt, cc: ccId, qty, name: PR.short, optLabel: optLabel + (CC ? "／ケース：" + CC.label : ""),
      thumb: prev.toDataURL("image/jpeg", .8), st: JSON.parse(JSON.stringify({ bg: st.bg, photos: st.photos, texts: st.texts })), media: media2 });
    history.replaceState(null, "", location.pathname + "?" + new URLSearchParams(Object.assign(Object.fromEntries(qs), { my: myId })));
    toast("マイデザインに保存しました（マイページから開けます）");
  }catch(err){ toast(err.message || "保存できませんでした"); }
  btn.disabled = false;
}
document.getElementById("saveMy").onclick = saveMy;
async function openMy(){
  const d = await myDesigns.get(myId).catch(() => null);
  if(!d){ myId = ""; toast("保存したデザインが見つかりませんでした"); return; }
  for(const p of d.st.photos){
    const md = d.media[p.id]; if(!md) continue;
    const orig = new Image(); orig.src = md.orig; await orig.decode();
    let cutImg = null;
    if(md.cutBlob){ cutImg = new Image(); cutImg.src = URL.createObjectURL(md.cutBlob); await cutImg.decode(); }
    media[p.id] = { img: md.cut && cutImg ? cutImg : orig, orig, cut: !!(md.cut && cutImg), cutImg, fileId: "", uploading: true, err: "" };
  }
  st.bg = d.st.bg; st.texts = d.st.texts || []; st.photos = d.st.photos.filter(p => media[p.id]);
  selP = (st.photos[st.photos.length - 1] || {}).id || null; sel = selP ? "photo" : null;
  draw(); renderPanel(); toast("保存したデザインを開きました");
  // 写真を送り直す（注文のときに必要）
  await Promise.all(st.photos.map(async (p, i) => {
    const m = media[p.id];
    try{ const r = await api({ action: "uploadPhoto", sid: DSID, name: "photo" + (i + 1) + ".jpg", data: m.orig.src.split(",")[1] }); m.fileId = r.fileId; }
    catch(err){ m.err = err.message; }
    m.uploading = false; if(selP === p.id) setState(photoStateText(), !!m.err);
  }));
  renderPanel();
}

window.LICO.chrome();
// 書体は使うときまで読み込まれないので、最初に全部読み込んでから描き直す
if(document.fonts){ document.fonts.ready.then(draw); Promise.all(P.fonts.map(f => document.fonts.load(`${f.weight || 400} 40px ${f.family}`, "あA").catch(() => {}))).then(draw); }
renderPanel(); draw();
if(myId) openMy();
})();
</script>
